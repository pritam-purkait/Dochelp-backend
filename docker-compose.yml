services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: doc-help-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: dochelp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - dochelp-pg-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d dochelp" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dochelp-pg-data: